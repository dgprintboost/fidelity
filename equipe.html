<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://content-firebaseappcheck.googleapis.com https://www.google.com/recaptcha/; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Tasty Crousty · Espace équipe</title>
  <script type="module" crossorigin src="/fidelity/assets/equipe-lBqAmojS.js"></script>
  <link rel="modulepreload" crossorigin href="/fidelity/assets/firebase-Cx5c5aku.js">
  <link rel="stylesheet" crossorigin href="/fidelity/assets/firebase-C2ngo90D.css">
</head>
<body class="page">
  <main class="shell gap-6">
    <header class="flex flex-col items-center gap-3">
      <div class="brand-logo">
        <img src="/fidelity/assets/logo_crousty-BOQVJJha.jpg" alt="Tasty Crousty" class="w-full h-full object-cover rounded-full">
      </div>
      <p class="pill">Espace équipe</p>
    </header>

    <!-- Connexion de l'équipe -->
    <form id="loginForm" class="flex flex-col gap-4" novalidate>
      <label class="flex flex-col gap-1.5">
        <span class="field-label">Email</span>
        <input id="email" name="email" class="field" type="email" autocomplete="username" required>
      </label>
      <div class="flex flex-col gap-1.5">
        <label for="password" class="field-label">Mot de passe</label>
        <div class="relative">
          <input id="password" name="password" class="field pr-20" type="password" autocomplete="current-password" required>
          <button id="togglePassword" class="absolute inset-y-0 right-0 px-4 text-[10px] font-bold uppercase tracking-widest text-crousty-cyan" type="button" aria-controls="password" aria-pressed="false">Afficher</button>
        </div>
      </div>
      <p id="loginError" class="text-xs text-crousty-pink min-h-4" role="alert"></p>
      <button id="loginBtn" class="btn-primary" type="submit">Se connecter</button>
    </form>

    <!-- Scan et actions, visibles une fois connecté -->
    <section id="staffPanel" class="hidden flex-col gap-4">
      <div class="rounded-2xl overflow-hidden border border-white/10 bg-black aspect-square">
        <video id="scanVideo" class="w-full h-full object-cover" muted playsinline></video>
      </div>
      <button id="scanBtn" class="btn-secondary" type="button">Scanner une carte</button>

      <div id="scanResult" class="hidden bg-white/5 border border-white/10 rounded-xl p-4 flex-col gap-3" aria-live="polite">
        <div class="flex items-baseline justify-between">
          <p id="clientName" class="text-lg font-black"></p>
          <p class="text-sm font-black"><span id="clientStamps">0</span>/10</p>
        </div>
        <button id="stampBtn" class="btn-primary" type="button">+1 tampon</button>
        <button id="rewardBtn" class="hidden btn-primary" type="button">🎁 Cadeau remis</button>
      </div>

      <p id="staffMessage" class="text-xs text-center min-h-4" role="status"></p>
      <button id="logoutBtn" class="text-[11px] text-gray-400 underline" type="button">Se déconnecter</button>
    </section>
  </main>

</body>
</html>
