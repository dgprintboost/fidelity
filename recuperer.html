<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://content-firebaseappcheck.googleapis.com https://www.google.com/recaptcha/; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07090d">
  <link rel="manifest" href="/fidelity/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/fidelity/icons/apple-touch-icon.png">
  <title>Tasty Crousty · Retrouver ma carte</title>
  <script type="module" crossorigin src="/fidelity/assets/recuperer-D88YNeB5.js"></script>
  <link rel="modulepreload" crossorigin href="/fidelity/assets/firebase-Cx5c5aku.js">
  <link rel="modulepreload" crossorigin href="/fidelity/assets/recovery-code-BGqYafz3.js">
  <link rel="stylesheet" crossorigin href="/fidelity/assets/firebase-C2ngo90D.css">
</head>
<body class="page">
  <main class="shell gap-6">
    <header class="flex flex-col items-center gap-3 animate-fade-in-up">
      <div class="brand-logo">
        <img src="/fidelity/assets/logo_crousty-BOQVJJha.jpg" alt="Tasty Crousty" class="w-full h-full object-cover rounded-full">
      </div>
      <h1 class="brand-title">TASTY<br>CROUSTY</h1>
      <p class="pill">Retrouver ma carte</p>
    </header>

    <p class="text-sm text-gray-400 text-center animate-fade-in-up [animation-delay:0.1s]">
      Saisis le code de secours affiché sur ta carte (par exemple <span class="font-mono text-white">K7P2-QX9M-4T</span>).
    </p>

    <form id="recoverForm" class="flex flex-col gap-4 animate-fade-in-up [animation-delay:0.2s]" novalidate>
      <label class="flex flex-col gap-1.5">
        <span class="field-label">Code de secours</span>
        <input id="recoveryInput" name="code" class="field font-mono uppercase tracking-widest" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="14" required>
      </label>
      <p id="recoverError" class="text-xs text-crousty-pink min-h-4" role="alert"></p>
      <button id="recoverBtn" class="btn-primary" type="submit">Retrouver ma carte</button>
    </form>

    <a href="./index.html" class="btn-secondary">Créer une nouvelle carte</a>

    <p class="footer-note">Tasty Crousty • Carte de fidélité</p>
  </main>

</body>
</html>
